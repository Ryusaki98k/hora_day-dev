name: hora_day
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  loading_animation_widget: ^1.3.0
  shared_preferences: ^2.3.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.4

flutter:
  assets:
    - assets/templates/
    - assets/icons/
    - .env
  uses-material-design: true
